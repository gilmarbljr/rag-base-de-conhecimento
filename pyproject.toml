[project]
name = "kb"
version = "0.1.0"
description = "Base de conhecimento gerenciável para RAG: ingestão versionada, busca e manutenção."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
admin = [
    "streamlit>=1.36",
    "pandas>=2.2",
]

[project.scripts]
kb = "kb.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "jinja2>=3.1",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: precisa de Postgres + pgvector (KB_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"
