name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: Lint, testes unitários e de integração
    runs-on: ubuntu-latest
    services:
      # Postgres com pgvector para os testes de integração (embeddings e reranker falsos).
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb
          POSTGRES_DB: kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KB_TEST_DATABASE_URL: postgresql://kb:kb@localhost:5432/kb
    steps:
      - uses: actions/checkout@v7
      # O setup-uv não publica tags de versão principal (v10); a versão é fixada por completo.
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Instalar dependências
        run: uv sync --extra admin
      - name: Lint
        run: uv run ruff check .
      - name: Testes (inclui corpus e golden set atualizados e integração com Postgres)
        run: uv run pytest -v

  dags:
    name: DAGs do Airflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir a imagem do Airflow com o pacote kb
        run: docker build -f docker/airflow.Dockerfile -t kb-airflow:ci .
      - name: Carregar as DAGs
        run: >-
          docker run --rm -v "$PWD:/opt/kb" -w /opt/kb
          -e KB_HOME=/opt/kb -e AIRFLOW__CORE__LOAD_EXAMPLES=false
          --entrypoint python kb-airflow:ci scripts/check_dags.py
